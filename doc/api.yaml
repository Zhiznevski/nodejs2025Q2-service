info:
  title: REST Service
  description: Home Library Service
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  schemas:
    CreateUserDto:
      type: object
      properties:
        login:
          type: string
          minLength: 4
          example: John Dory
        password:
          type: string
          minLength: 4
          example: Qwerty123
      required:
        - login
        - password
    UserResponse:
      type: object
      properties:
        id:
          type: string
        login:
          type: string
        version:
          type: number
        createdAt:
          type: number
        updatedAt:
          type: number
      required:
        - id
        - login
        - version
        - createdAt
        - updatedAt
    UpdatePasswordDto:
      type: object
      properties:
        oldPassword:
          type: string
          description: Must match your old password
        newPassword:
          type: string
          minLength: 4
      required:
        - oldPassword
        - newPassword
    CreateUpdateArtistDto:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          example: Mario
        grammy:
          type: boolean
      required:
        - name
        - grammy
    ArtistResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        grammy:
          type: boolean
      required:
        - id
        - name
        - grammy
    CreateUpdateTrackDto:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          example: I wanna be yours
        duration:
          type: number
          example: 360
        artistId:
          type: string
          example: null
        albumId:
          type: string
          example: null
      required:
        - name
        - duration
        - artistId
        - albumId
    TrackResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        artistId:
          type: string
        albumId:
          type: string
        duration:
          type: number
      required:
        - id
        - name
        - artistId
        - albumId
        - duration
    CreateUpdateAlbumDto:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          example: Dancing Shadows
        year:
          type: number
          example: 1996
        artistId:
          type: string
          example: null
      required:
        - name
        - year
        - artistId
    AlbumResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        year:
          type: number
        artistId:
          type: string
      required:
        - id
        - name
        - year
        - artistId
    Artist:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        grammy:
          type: boolean
      required:
        - id
        - name
        - grammy
    Album:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        year:
          type: number
        artistId:
          type: string
      required:
        - id
        - name
        - year
        - artistId
    Track:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        artistId:
          type: string
        albumId:
          type: string
        duration:
          type: number
      required:
        - id
        - name
        - artistId
        - albumId
        - duration
    GetFavoritesResponse:
      type: object
      properties:
        artists:
          type: array
          items:
            $ref: '#/components/schemas/Artist'
        albums:
          type: array
          items:
            $ref: '#/components/schemas/Album'
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/Track'
      required:
        - artists
        - albums
        - tracks
