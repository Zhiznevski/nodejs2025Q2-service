openapi: 3.0.0
paths:
  /user:
    post:
      operationId: create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDto'
      responses:
        '201':
          description: The user has been successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: The body does not contain required fields
      summary: Create a user with login and password
      tags:
        - Users
    get:
      operationId: findAll
      parameters: []
      responses:
        '200':
          description: The list of users have been successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
      summary: Get all users
      tags:
        - Users
  /user/{id}:
    get:
      operationId: findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: The user has been successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: The id is invalid (not uuid)
        '404':
          description: The id doesn't exist
      summary: Get single user
      tags:
        - Users
    put:
      operationId: updatePassword
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordDto'
      responses:
        '200':
          description: The user's password has been successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: The id is invalid (not uuid)
        '403':
          description: The oldPassword is wrong
        '404':
          description: The id doesn't exist
      summary: Update user's password
      tags:
        - Users
    delete:
      operationId: remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: The user has been successfully removed
        '400':
          description: The id is invalid (not uuid)
        '404':
          description: The id doesn't exist
      summary: Delete user
      tags:
        - Users
